name: Check game updates
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
concurrency: check-updates
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-updates.mjs
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
